<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한글 학습 조합기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; padding: 20px; }
        .maker-frame { width: 100%; max-width: 500px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        
        .slot-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 30px; }
        .top-row { display: flex; gap: 15px; }
        
        .slot { width: 80px; height: 80px; border: 2px solid #e0e0e0; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; transition: all 0.3s; }
        .jong-slot { width: 175px; }

        /* 색상 구분 */
        .cho { background-color: #fff5f5; border-color: #ffcdd2; }
        .jung { background-color: #f1f8e9; border-color: #c8e6c9; }
        .jong { background-color: #e3f2fd; border-color: #bbdefb; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .p-btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-cho { background-color: #e57373; color: white; }
        .btn-jung { background-color: #81c784; color: white; }
        .btn-jong { background-color: #64b5f6; color: white; }
        
        #txtResult { font-size: 5rem; margin: 20px 0; color: #333; font-weight: 700; height: 100px; }
    </style>
</head>
<body>

<div class="maker-frame">
    <div id="txtResult">-</div>
    
    <div class="slot-wrapper">
        <div class="top-row">
            <div class="slot cho" id="slot-cho">-</div>
            <div class="slot jung" id="slot-jung">-</div>
        </div>
        <div class="slot jong jong-slot" id="slot-jong">-</div>
    </div>

    <!-- 초성 버튼 -->
    <div class="btn-group">
        <button class="p-btn btn-cho" onclick="setSlot('cho', 'ㄱ')">ㄱ</button>
        <button class="p-btn btn-cho" onclick="setSlot('cho', 'ㄴ')">ㄴ</button>
    </div>
    <!-- 중성 버튼 -->
    <div class="btn-group">
        <button class="p-btn btn-jung" onclick="setSlot('jung', 'ㅏ')">ㅏ</button>
        <button class="p-btn btn-jung" onclick="setSlot('jung', 'ㅓ')">ㅓ</button>
    </div>
    <!-- 종성 버튼 -->
    <div class="btn-group">
        <button class="p-btn btn-jong" onclick="setSlot('jong', 'ㄱ')">ㄱ</button>
        <button class="p-btn btn-jong" onclick="setSlot('jong', 'ㅁ')">ㅁ</button>
    </div>
</div>

<script>
    // 독립적인 상태 관리
    const state = {
        cho: '',
        jung: '',
        jong: ''
    };

    function setSlot(type, char) {
        // 1. 상태 업데이트
        state[type] = char;

        // 2. 해당 슬롯만 갱신 (선택자 분리)
        document.getElementById('slot-' + type).innerText = char;

        // 3. 결과 조합 ( '-' 표시 제거를 위해 조건문 추가)
        const displayCho = state.cho || '';
        const displayJung = state.jung || '';
        const displayJong = state.jong || '';
        
        document.getElementById('txtResult').innerText = displayCho + displayJung + displayJong;
    }
</script>

</body>
</html>

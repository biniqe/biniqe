<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한글 학습 및 조합 앱</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .navbar { width: 100%; height: 60px; background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; padding: 0 20px; position: fixed; top: 0; z-index: 100; box-sizing: border-box; }
        .main-content { margin-top: 80px; padding: 10px; width: 100%; max-width: 900px; }
        
        /* 메인 조합 레이아웃 */
        .builder-container { display: flex; gap: 15px; justify-content: center; align-items: flex-start; }
        
        /* 왼쪽 영역: 종성 모음 */
        .left-panel { display: flex; flex-direction: column; gap: 10px; }
        .palette-box { background: #ffffff; border: 2px solid #ddd; border-radius: 12px; padding: 10px; display: grid; gap: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .box-jong { grid-template-columns: repeat(5, 1fr); } /* 종성 5열 배치 */
        
        /* 중앙 영역: 조합 판 */
        .center-panel { background: #ffffff; border: 3px solid #1565c0; border-radius: 20px; padding: 20px; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .result-display { font-size: 80px; font-weight: bold; color: #1565c0; margin: 10px 0; }
        
        /* 오른쪽 영역: 초성/중성 */
        .right-panel { display: flex; flex-direction: column; gap: 10px; }
        .box-cho-jung { grid-template-columns: repeat(4, 1fr); }

        .p-btn { background-color: #fff; border: 1px solid #ccc; border-radius: 6px; width: 40px; height: 40px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .p-btn:hover { background-color: #f0f0f0; }
        .p-btn.active { background-color: #1565c0; color: white; border-color: #0d47a1; }

        .btn-listen { padding: 15px 40px; background-color: #4caf50; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar"><div class="nav-title">한글 만들기 조합</div></div>

    <div class="main-content">
        <div class="builder-container">
            <!-- 왼쪽: 종성 판 -->
            <div class="left-panel">
                <div style="font-weight:bold; margin-bottom:5px;">받침 (종성)</div>
                <div class="palette-box box-jong" id="paletteJong"></div>
            </div>

            <!-- 중앙: 결과판 -->
            <div class="center-panel">
                <div class="result-display" id="txtResult">-</div>
                <button class="btn-listen" onclick="playSyllable()">🔊 듣기</button>
                <button onclick="resetAll()" style="background:none; border:none; cursor:pointer; color:#777;">초기화</button>
            </div>

            <!-- 오른쪽: 초성 및 중성 -->
            <div class="right-panel">
                <div style="font-weight:bold; margin-bottom:5px;">자음 (초성)</div>
                <div class="palette-box box-cho-jung" id="paletteCho"></div>
                <div style="font-weight:bold; margin-top:10px; margin-bottom:5px;">모음 (중성)</div>
                <div class="palette-box box-cho-jung" id="paletteJung"></div>
            </div>
        </div>
    </div>

    <script>
        const chos = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㄲ','ㄸ','ㅃ','ㅆ','ㅉ'];
        const jungs = ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ','ㅐ','ㅒ','ㅔ','ㅖ','ㅘ','ㅙ','ㅚ','ㅝ','ㅞ','ㅟ','ㅢ'];
        const jongs = ['','ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㄲ','ㅆ'];
        
        let c='', j='', k='';

        function render(id, list, type) {
            const el = document.getElementById(id);
            list.forEach(char => {
                let btn = document.createElement('button');
                btn.className = 'p-btn';
                btn.textContent = char || '없음';
                btn.onclick = () => {
                    if(type === 'c') c = char;
                    if(type === 'j') j = char;
                    if(type === 'k') k = (char === '없음' ? '' : char);
                    update();
                };
                el.appendChild(btn);
            });
        }

        function update() {
            // 한글 조합 로직 (간단 구현)
            document.getElementById('txtResult').textContent = (c || '') + (j || '') + (k || '');
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
            // 선택된 버튼 활성화 로직 추가 필요
        }

        function playSyllable() {
            let text = document.getElementById('txtResult').textContent;
            if(text !== '-') {
                speechSynthesis.cancel();
                speechSynthesis.speak(new SpeechSynthesisUtterance(text));
            }
        }

        function resetAll() { c=''; j=''; k=''; update(); }

        render('paletteCho', chos, 'c');
        render('paletteJung', jungs, 'j');
        render('paletteJong', jongs, 'k');
    </script>
</body>
</html>

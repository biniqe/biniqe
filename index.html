<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한글 학습 및 조합 앱</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            box-sizing: border-box;
        }

        .hamburger {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            margin-right: 15px;
            color: #333;
        }

        .nav-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 3px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 200;
            padding-top: 80px;
            box-sizing: border-box;
        }

        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 15px 25px; color: #333; text-decoration: none; font-size: 15px; font-weight: bold; transition: background 0.2s; border-bottom: 1px solid #f1f1f1; }
        .sidebar a:hover, .sidebar a.active { background-color: #e3f2fd; color: #1565c0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); display: none; z-index: 150; }
        .overlay.open { display: block; }

        .main-content {
            margin-top: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .page-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page-section.active { display: flex; }

        h2 { color: #333; margin: 4px 0; text-align: center; font-size: 18px; }
        p.guide { color: #666; font-size: 12px; margin-bottom: 6px; text-align: center; }

        .table-container { overflow-x: auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); max-width: 100%; }
        table { border-collapse: collapse; text-align: center; }
        th, td { width: 38px; height: 38px; border: 1px solid #e0e0e0; font-size: 15px; font-weight: bold; cursor: pointer; transition: background-color 0.15s; }
        th { background-color: #f8f9fa; color: #555; font-size: 12px; }
        
        th.highlight { background-color: #bbdefb !important; color: #0d47a1 !important; }
        td.highlight { background-color: #e3f2fd !important; color: #1565c0; }
        td.selected { background-color: #2196f3 !important; color: #ffffff !important; }

        /* ================= 올바른 세로형 비율 & 박스 안쪽 정렬 레이아웃 ================= */
        .baby-layout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 780px;
            box-sizing: border-box;
        }

        .baby-board {
            background: #ffffff;
            border: 3px solid #b0bec5;
            border-radius: 16px;
            padding: 8px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-sizing: border-box;
        }

        .baby-top-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .palette-box {
            border-radius: 10px;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 기본 초성/중성은 4열 */
            gap: 3px; 
            justify-items: center;
            align-content: center;
            box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        /* 종성은 한 줄에 6개씩(6열) 정렬 */
        .palette-box.box-jong-grid {
            grid-template-columns: repeat(6, 1fr);
        }

        .box-cho { 
            background: #ffcdd2; 
            border: 2px solid #ef5350; 
            flex: 1.2; 
            min-height: 230px; 
        }
        
        .center-result-box {
            background: #fffde7;
            border: 3px solid #ffb300;
            border-radius: 14px;
            width: 120px;
            min-width: 120px;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .result-char {
            font-size: 60px;
            font-weight: bold;
            color: #d32f2f;
            line-height: 1;
        }

        .box-jung-right { 
            background: #c8e6c9; 
            border: 2px solid #66bb6a; 
            flex: 1.2; 
            min-height: 230px; 
        }

        /* 종성 박스 높이 확보 및 내부 여백 조절 */
        .box-jong { 
            background: #bbdefb; 
            border: 2px solid #42a5f5; 
            width: 100%; 
            min-height: 110px; 
        }

        /* 세로형 비율 버튼 크기 조정 (박스 내부에 딱 맞게 핏팅) */
        .p-btn {
            background-color: #ffffff;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
            width: 100%;
            height: 48px;  /* 세로로 긴 직사각형 모양 */
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            padding: 0;
            box-sizing: border-box;
        }
        .p-btn:hover { background-color: #f1f1f1; transform: scale(0.95); }
        .p-btn.active { background-color: #1565c0; color: white; border-color: #0d47a1; }

        .control-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 2px;
        }

        .btn-action {
            padding: 8px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-listen { background-color: #4caf50; color: white; }
        .btn-reset { background-color: #e0e0e0; color: #333; }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="nav-title" id="navTitle">1. 기본 음절표</div>
    </div>

    <div class="sidebar" id="sidebar">
        <a href="#" onclick="switchPage('page1', '1. 기본 음절표')" class="active">1. 기본 음절표</a>
        <a href="#" onclick="switchPage('page2', '2. 쌍자음 음절표')">2. 쌍자음 음절표</a>
        <a href="#" onclick="switchPage('page3', '3. 복합 모음표')">3. 복합 모음표</a>
        <a href="#" onclick="switchPage('page4', '4. 받침(종성) 음절표')">4. 받침(종성) 음절표</a>
        <a href="#" onclick="switchPage('page5', '5. 한글 만들기 조합')">5. 한글 만들기 조합</a>
    </div>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="main-content">
        <div id="page1" class="page-section active"><h2>기본 음절표</h2><div class="table-container"><table id="table1"></table></div></div>
        <div id="page2" class="page-section"><h2>쌍자음 음절표</h2><div class="table-container"><table id="table2"></table></div></div>
        <div id="page3" class="page-section"><h2>복합 모음표</h2><div class="table-container"><table id="table3"></table></div></div>
        <div id="page4" class="page-section"><h2>받침(종성) 음절표</h2><div class="table-container"><table id="table4"></table></div></div>
        
        <!-- 페이지 5: 삐져나감 없이 깔끔하게 정돈된 세로형 조합 화면 -->
        <div id="page5" class="page-section">
            <h2>한글 만들기 조합</h2>
            <p class="guide">자음과 모음을 눌러서 글자를 만들어 봐요!</p>
            
            <div class="baby-layout-wrapper">
                <div class="baby-board">
                    <!-- 상단: 초성(좌) / 결과글자(중앙) / 중성(우) -->
                    <div class="baby-top-row">
                        <div class="palette-box box-cho" id="paletteCho" title="초성 (자음)"></div>
                        
                        <div class="center-result-box">
                            <div class="result-char" id="txtResult">-</div>
                        </div>

                        <div class="palette-box box-jung-right" id="paletteJungRight" title="중성 (모음)"></div>
                    </div>

                    <!-- 하단: 종성 (받침 전체 - 한 줄에 6개씩 세로형 배치 및 높이 확보) -->
                    <div class="palette-box box-jong box-jong-grid" id="paletteJong" title="종성 (받침)"></div>

                    <!-- 제어 버튼 -->
                    <div class="control-panel">
                        <button class="btn-action btn-reset" onclick="resetBuilder()">초기화</button>
                        <button class="btn-action btn-listen" onclick="playCombinedSyllable()">🔊 소리 듣기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const basicChoseong = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ', 'ㄲ', 'ㄸ', 'ㅃ', 'ㅆ', 'ㅉ'];
        const basicJungseong = ['ㅏ', 'ㅑ', 'ㅓ', 'ㅕ', 'ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ', 'ㅣ', 'ㅐ', 'ㅒ', 'ㅔ', 'ㅖ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅢ'];
        const complexJungseong = ['ㅐ', 'ㅒ', 'ㅔ', 'ㅖ', 'ㅘ', 'ㅙ', 'ㅚ', 'ㅝ', 'ㅞ', 'ㅟ', 'ㅢ'];
        const jongseongList = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        let currentCho = '', currentJung = '', currentJong = '';

        const choMap = { 'ㄱ':0, 'ㄲ':1, 'ㄴ':2, 'ㄷ':3, 'ㄸ':4, 'ㄹ':5, 'ㅁ':6, 'ㅂ':7, 'ㅃ':8, 'ㅅ':9, 'ㅆ':10, 'ㅇ':11, 'ㅈ':12, 'ㅉ':13, 'ㅊ':14, 'ㅋ':15, 'ㅌ':16, 'ㅍ':17, 'ㅎ':18 };
        const jungMap = { 'ㅏ':0, 'ㅐ':1, 'ㅑ':2, 'ㅒ':3, 'ㅓ':4, 'ㅔ':5, 'ㅕ':6, 'ㅖ':7, 'ㅗ':8, 'ㅘ':9, 'ㅙ':10, 'ㅚ':11, 'ㅛ':12, 'ㅜ':13, 'ㅝ':14, 'ㅞ':15, 'ㅟ':16, 'ㅠ':17, 'ㅡ':18, 'ㅢ':19, 'ㅣ':20 };
        const jongMap = { 'ㄱ':1, 'ㄲ':2, 'ㄳ':3, 'ㄴ':4, 'ㄵ':5, 'ㄶ':6, 'ㄷ':7, 'ㄹ':8, 'ㄺ':9, 'ㄻ':10, 'ㄼ':11, 'ㄽ':12, 'ㄾ':13, 'ㄿ':14, 'ㅀ':15, 'ㅁ':16, 'ㅂ':17, 'ㅄ':18, 'ㅅ':19, 'ㅆ':20, 'ㅇ':21, 'ㅈ':22, 'ㅊ':23, 'ㅋ':24, 'ㅌ':25, 'ㅍ':26, 'ㅎ':27 };

        function getSyllable(cho, jung, jong = '') {
            if (!cho && !jung) return '';
            const cIdx = choMap[cho] !== undefined ? choMap[cho] : 0;
            const jIdx = jungMap[jung] !== undefined ? jungMap[jung] : 0;
            const jngIdx = jongMap[jong] !== undefined ? jongMap[jong] : 0;
            
            if (cho && jung) {
                return String.fromCharCode(44032 + (cIdx * 21 * 28) + (jIdx * 28) + jngIdx);
            } else if (cho && !jung) {
                return cho;
            } else if (!cho && jung) {
                return jung;
            }
            return '';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function switchPage(pageId, titleText) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
            document.getElementById('navTitle').textContent = titleText;
            toggleSidebar();
        }

        function initBuilder() {
            renderPalette('paletteCho', basicChoseong, (val) => currentCho = (currentCho === val) ? '' : val);
            renderPalette('paletteJungRight', basicJungseong, (val) => currentJung = (currentJung === val) ? '' : val);
            renderPalette('paletteJong', jongseongList, (val) => currentJong = (currentJong === val) ? '' : val);
        }

        function renderPalette(id, list, onClick) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            list.forEach(item => {
                let btn = document.createElement('button');
                btn.className = 'p-btn';
                btn.textContent = item;
                btn.onclick = () => { onClick(item); updateBuilderUI(); };
                container.appendChild(btn);
            });
        }

        function updateBuilderUI() {
            const updateBoxActive = (id, targetVal) => {
                const container = document.getElementById(id);
                if (!container) return;
                container.querySelectorAll('.p-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent === targetVal);
                });
            };

            updateBoxActive('paletteCho', currentCho);
            updateBoxActive('paletteJungRight', currentJung);
            updateBoxActive('paletteJong', currentJong);

            let resultChar = getSyllable(currentCho, currentJung, currentJong);
            document.getElementById('txtResult').textContent = resultChar || '-';
        }

        function resetBuilder() {
            currentCho = '';
            currentJung = '';
            currentJong = '';
            updateBuilderUI();
        }

        function playCombinedSyllable() {
            let res = document.getElementById('txtResult').textContent;
            if (res && res !== '-') {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(res);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('만들어진 글자가 없어요!');
            }
        }

        const consonantNames = {'ㄱ':'기역','ㄲ':'쌍기역','ㄴ':'니은','ㄷ':'디귿','ㄸ':'쌍디귿','ㄹ':'리을','ㅁ':'미음','ㅂ':'비읍','ㅃ':'쌍비읍','ㅅ':'시옷','ㅆ':'쌍시옷','ㅇ':'이응','ㅈ':'지읒','ㅉ':'쌍지읒','ㅊ':'치읓','ㅋ':'키읔','ㅌ':'티읕','ㅍ':'피읖','ㅎ':'히엏'};
        
        function createTable(tableId, rowHeaders, colHeaders, isJongseongTable = false) {
            const table = document.getElementById(tableId);
            table.innerHTML = '';
            
            let headerRow = document.createElement('tr');
            let corner = document.createElement('th');
            corner.textContent = isJongseongTable ? '자\\받침' : '자\\모';
            headerRow.appendChild(corner);
            
            colHeaders.forEach((col, cIdx) => {
                let th = document.createElement('th');
                th.textContent = col;
                th.onclick = () => playPronunciation(consonantNames[col] || col);
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            rowHeaders.forEach((rowHead, rIdx) => {
                let row = document.createElement('tr');
                let rTh = document.createElement('th');
                rTh.textContent = rowHead;
                rTh.onclick = () => playPronunciation(consonantNames[rowHead] || rowHead);
                row.appendChild(rTh);

                colHeaders.forEach((colHead, cIdx) => {
                    let td = document.createElement('td');
                    let syllable = isJongseongTable ? getSyllable(rowHead, 'ㅏ', colHead) : getSyllable(rowHead, colHead, '');
                    td.textContent = syllable;
                    
                    td.onclick = () => {
                        playPronunciation(syllable);
                        table.querySelectorAll('th, td').forEach(el => el.classList.remove('highlight', 'selected'));
                        td.classList.add('selected');

                        let rowHeaderEl = row.querySelector('th');
                        if (rowHeaderEl) rowHeaderEl.classList.add('highlight');

                        let colHeaderEl = headerRow.children[cIdx + 1];
                        if (colHeaderEl) colHeaderEl.classList.add('highlight');
                    };

                    row.appendChild(td);
                });
                table.appendChild(row);
            });
        }

        function playPronunciation(text) {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        window.onload = () => {
            createTable('table1', ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'], basicJungseong.slice(0, 10));
            createTable('table2', ['ㄲ','ㄸ','ㅃ','ㅆ','ㅉ'], basicJungseong.slice(0, 10));
            createTable('table3', ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'], complexJungseong);
            createTable('table4', ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'], jongseongList, true);
            initBuilder();
        };
    </script>
</body>
</html>
